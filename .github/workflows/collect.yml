name: collect

# Twice a day. The second run is normally a no-op that makes zero HTTP calls
# and writes nothing, because a `complete` day is skipped — so the only cost of
# the redundancy is a few seconds of runner time, and the benefit is that a
# single missed or delayed schedule does not lose a day that cannot be
# reconstructed later.
on:
  schedule:
    - cron: "20 6 * * *"
    - cron: "20 18 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Snapshot date (UTC, YYYY-MM-DD). Blank means today."
        required: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect snapshot
        id: collect
        run: |
          python -m collector ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        continue-on-error: true

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%F)"
          # Another run may have pushed between checkout and now.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # After the commit, never before it: whatever was collected must reach
      # durable storage even when the audit is about to fail the job.
      - name: Audit the Bronze layer
        id: audit
        run: python -m collector.audit
        continue-on-error: true

      - name: Fail if the day is incomplete
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::snapshot is partial - see the manifest in the commit above"
          exit 1

      - name: Fail if the audit found problems
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::bronze audit failed - see the findings above"
          exit 1
