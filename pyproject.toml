[project]
name = "ai-adoption-collector"
version = "0.1.0"
description = "Daily raw snapshots of OpenRouter and HuggingFace model usage"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
